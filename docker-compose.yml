services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess_wager
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    depends_on:
      - db
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@db:5432/chess_wager
      JWT_SECRET: local-dev-secret-change-in-production
      CORS_ORIGIN: http://localhost:5173,http://localhost:4173

volumes:
  pgdata:
